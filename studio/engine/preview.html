<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Studio preview</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg: #0d0e11; --panel: #16181d; --line: #2a2e36; --ink: #e8eaee; --dim: #8a909c; --accent: #ff9a4d; --edit: #ff5c7a; --beat: #3a3f49; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 13px/1.4 ui-sans-serif, system-ui, "Segoe UI", sans-serif; }
  body { display: grid; grid-template-rows: 1fr auto; }
  #stage { position: relative; min-height: 0; display: grid; place-items: center; overflow: hidden; }
  #wrap { position: relative; }
  #gl, #ov { position: absolute; inset: 0; width: 100%; height: 100%; }
  #ov { pointer-events: none; }
  #err { position: absolute; inset: 16px; white-space: pre-wrap; color: #ff8a8a; font: 12px ui-monospace, Consolas, monospace; overflow: auto; display: none; }
  #bar { background: var(--panel); border-top: 1px solid var(--line); padding: 8px 12px 10px; display: grid; gap: 8px; }
  #row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  button, select, input { background: #20232a; color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px; font: inherit; }
  button:hover { border-color: #3d4350; }
  button.on { border-color: var(--accent); color: var(--accent); }
  #time { font: 13px ui-monospace, Consolas, monospace; min-width: 250px; }
  #fps { color: var(--dim); font: 12px ui-monospace, Consolas, monospace; }
  #scrub { position: relative; height: 34px; background: #111317; border: 1px solid var(--line); border-radius: 6px; cursor: pointer; touch-action: none; }
  #scrub canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #note { flex: 1; min-width: 220px; }
  .sp { flex: 1; }
  #notes { color: var(--dim); font-size: 12px; max-height: 3.2em; overflow: auto; }
</style>
<script type="importmap">{ "imports": { "three": "/node_modules/three/build/three.module.js", "three/addons/": "/node_modules/three/examples/jsm/", "opentype": "/node_modules/opentype.js/dist/opentype.mjs" } }</script>
</head>
<body>
<div id="stage"><div id="wrap"><canvas id="gl"></canvas><canvas id="ov"></canvas></div><div id="err"></div></div>
<div id="bar">
  <div id="scrub"><canvas id="sc"></canvas></div>
  <div id="row">
    <button id="play" title="Space">Play</button>
    <span id="time">0.00 s</span>
    <span id="fmts"></span>
    <select id="q" title="Sub-frames per frame while scrubbing (playback always uses 1)"><option value="1">1 sample</option><option value="4">4 samples</option><option value="12">12 samples</option></select>
    <select id="res" title="Preview resolution"><option value="0.5">half res</option><option value="1">full res</option><option value="0.33">third res</option></select>
    <button id="safe" title="S: safe area and centre lines">Safe</button>
    <button id="mute" title="M">Sound on</button>
    <span id="fps"></span>
    <span class="sp"></span>
    <input id="note" placeholder="Note at this time (Enter to save to notes.md)" autocomplete="off">
  </div>
  <div id="notes"></div>
</div>
<script type="module" src="./preview.js"></script>
</body>
</html>
